<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opportunity Registry</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#16213e;color:white;padding:18px}header h1{margin:0 0 6px;font-size:1.55rem}main{max-width:1050px;margin:auto;padding:18px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,.button{border:0;border-radius:7px;padding:10px 13px;cursor:pointer;background:#e6eaf2;color:#172033;font-weight:600}button.primary{background:#16213e;color:white}button:focus,input:focus,textarea:focus,select:focus{outline:3px solid #8db8ff;outline-offset:1px}.card{background:#fff;border:1px solid #d9deea;border-radius:10px;padding:16px;margin:12px 0;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0 14px}label{display:block;font-weight:600;margin:8px 0 4px}input,textarea,select{width:100%;padding:10px;margin:4px 0 10px;border:1px solid #aeb8ca;border-radius:6px;font:inherit}textarea{min-height:95px;resize:vertical}.muted{color:#566174}.status{display:inline-block;background:#eef1f6;border-radius:5px;padding:4px 7px;font-size:.9rem}.notice{padding:10px 12px;border-left:4px solid #64748b;background:#eef2f7;border-radius:4px;margin:10px 0}.error{color:#a01818}.success{color:#12623b}h2{margin-top:8px}hr{border:0;border-top:1px solid #e0e4ed;margin:16px 0}@media(max-width:390px){main{padding:10px}.card{padding:12px}header{padding:14px}}
</style>
</head>
<body>
<header><h1>Opportunity Registry</h1><div id="status" aria-live="polite">Browsing as guest</div></header>
<main>
<section class="card" id="signin"><h2>Sign in for faculty tools</h2><p class="muted">Use a demo <b>@algomau.ca</b> account for this course prototype. Partners do not need an account to submit an opportunity.</p><div class="fields"><div><label for="email">Algoma email</label><input id="email" type="email" placeholder="f-alex@algomau.ca"></div></div><button class="primary" onclick="login()">Sign in</button> <button onclick="logout()">Sign out</button><p id="loginMsg" aria-live="polite"></p></section>
<nav aria-label="Main navigation">
<button onclick="showIntake()">Submit an Industry Project</button><button onclick="showIndustry()">Discover Industry Opportunities</button><button onclick="showFaculty()">Browse Faculty</button><button onclick="showProjects()">Browse Faculty Projects</button><button onclick="showFacultyInbox()">Faculty Intake & Coordination</button><button onclick="showSubscriptions()">Notification Settings</button><button onclick="showNotifications()">Notifications</button><button onclick="showMy()">My Faculty Tools</button>
</nav>
<section id="content" aria-live="polite"></section>
</main>
<script>
let email=localStorage.getItem('demoEmail')||''; let currentUser=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function headers(){let h={'Content-Type':'application/json'};if(email)h['X-Demo-Email']=email;return h}
async function api(url,options={}){options.headers={...headers(),...(options.headers||{})};let r=await fetch(url,options);let d;try{d=await r.json()}catch{d={}}if(!r.ok){let detail=d.detail||'Request failed';if(Array.isArray(detail))detail=detail.map(x=>`${(x.loc||[]).slice(1).join('.')||'Field'}: ${x.msg}`).join(' ');throw Error(detail)}return d}
function showError(e){document.getElementById('content').innerHTML=`<div class="card error"><b>Could not complete the request:</b> ${esc(e.message)}</div>`}
async function refreshUser(){currentUser=null;if(email){try{currentUser=await api('/api/me');document.getElementById('status').textContent=`Signed in: ${currentUser.email} (${currentUser.role}${currentUser.verified_faculty===1?', verified faculty':''})`}catch{email='';localStorage.removeItem('demoEmail')}}if(!email)document.getElementById('status').textContent='Browsing as guest'}
async function login(){try{const value=document.getElementById('email').value.trim().toLowerCase();await api('/api/login',{method:'POST',body:JSON.stringify({email:value})});email=value;localStorage.setItem('demoEmail',email);await refreshUser();document.getElementById('loginMsg').textContent='Signed in. Faculty-only actions are still checked by the server.';document.getElementById('loginMsg').className='success';showIndustry()}catch(e){document.getElementById('loginMsg').textContent=e.message;document.getElementById('loginMsg').className='error'}}
async function logout(){email='';currentUser=null;localStorage.removeItem('demoEmail');await refreshUser();document.getElementById('loginMsg').textContent='Signed out. You can still submit a partner opportunity and browse supervised public opportunities.';showIndustry()}
function renderCards(items,fn,empty){return items.length?`<div class="grid">${items.map(fn).join('')}</div>`:`<p>${esc(empty)}</p>`}
function showIntake(){document.getElementById('content').innerHTML=`<div class="card"><h2>Submit an Industry Project</h2><p>Submit without creating an account. A submission is reviewed by verified faculty and will not appear to students until a faculty member volunteers to supervise it.</p><form id="intakeForm"><div class="fields"><div><label for="org">Organisation *</label><input id="org" required maxlength="200"></div><div><label for="contact">Contact name *</label><input id="contact" required maxlength="200"></div><div><label for="contactEmail">Contact email *</label><input id="contactEmail" type="email" required></div><div><label for="title">Project title *</label><input id="title" required maxlength="200"></div><div><label for="capacity">Capacity signal *</label><select id="capacity"><option value="one-team-only">One team only</option><option value="multiple-teams">Multiple teams possible</option><option value="not-sure">Not sure</option></select></div></div><label for="areas">Research/project areas * (comma-separated)</label><input id="areas" required placeholder="Human-Computer Interaction, Data Science"><label for="description">Description *</label><textarea id="description" required maxlength="5000"></textarea><button class="primary" type="submit">Submit opportunity</button><p id="intakeMsg" aria-live="polite"></p></form></div>`;document.getElementById('intakeForm').addEventListener('submit',submitIntake)}
async function submitIntake(ev){ev.preventDefault();const msg=document.getElementById('intakeMsg');try{const areas=document.getElementById('areas').value.split(',').map(x=>x.trim()).filter(Boolean);const d={organisation_name:document.getElementById('org').value,contact_name:document.getElementById('contact').value,contact_email:document.getElementById('contactEmail').value,title:document.getElementById('title').value,description:document.getElementById('description').value,areas,capacity:document.getElementById('capacity').value};const r=await api('/api/intake',{method:'POST',body:JSON.stringify(d)});msg.className='success';msg.textContent=`${r.message} Reference: ${r.opportunity_id}.`;document.getElementById('intakeForm').reset()}catch(e){msg.className='error';msg.textContent=e.message}}
function industryCard(x,faculty=false,canAct=true){const cap={'one-team-only':'One team only','multiple-teams':'Multiple teams possible','not-sure':'Not sure'}[x.capacity]||x.capacity;const supervisors=(x.supervisors||[]).map(s=>`<li>${esc(s.display_name)} — <button onclick="detailFaculty(${s.faculty_id})">View faculty profile</button>${s.email?` <a href="mailto:${encodeURIComponent(s.email)}?subject=${encodeURIComponent('Industry project inquiry: '+x.title)}">Contact faculty</a>`:''}</li>`).join('');return `<article class="card"><h3>${esc(x.title)}</h3><p><b>Organisation:</b> ${esc(x.organisation_name)}</p><p>${esc(x.description)}</p><p><b>Areas:</b> ${esc(x.areas)}</p><p><b>Capacity:</b> ${esc(cap)}</p><p><b>Status:</b> <span class="status">${x.interest_count>0?'Supervised':'Awaiting faculty supervisor'}</span> &nbsp; <b>Faculty interest:</b> ${Number(x.interest_count)||0}</p>${faculty?`<p><b>Partner contact (faculty/staff only):</b> ${esc(x.contact_name)} — <a href="mailto:${encodeURIComponent(x.contact_email||'')}">${esc(x.contact_email)}</a></p><p><b>Engagement:</b> ${esc(x.engagement_state||'Not contacted')}${x.engagement_lead?' — led by '+esc(x.engagement_lead):''}</p><p><b>Supervisors:</b> ${esc((x.supervisor_names||[]).join(', ')||'None yet')}</p>${canAct?`<button class="primary" onclick="willing(${x.id},true)">I am willing to supervise</button> <button onclick="willing(${x.id},false)">Withdraw my willingness</button><hr><label for="eng${x.id}">Partner engagement state</label><select id="eng${x.id}"><option>Not contacted</option><option>Discussion underway</option><option>Partner confirmed</option><option>No longer pursuing</option></select> <button onclick="engage(${x.id})">Save engagement</button>`:''}`:`${x.supervisor_names?.length?`<p><b>Faculty supervisor(s):</b></p><ul>${supervisors}</ul>`:''}`}</article>`}
async function showIndustry(){try{const data=await api('/api/industry-opportunities');document.getElementById('content').innerHTML=`<h2>Industry Opportunities</h2><p class="muted">Only opportunities with at least one verified faculty supervisor are shown to students and guests. Partner contact details and faculty engagement are private.</p>${renderCards(data,x=>industryCard(x,false),'No supervised industry opportunities are available yet.')}`}catch(e){showError(e)}}
async function showFacultyInbox(){try{if(!currentUser)await refreshUser();if(!currentUser||(currentUser.verified_faculty!==1&&currentUser.role!=='admin'))throw Error('Sign in with a verified faculty or staff/admin account to view pending submissions and coordination details.');const data=await api('/api/industry-opportunities');document.getElementById('content').innerHTML=`<h2>Faculty Intake & Coordination</h2><p>Pending submissions are visible to verified faculty and staff. Engagement is coordination information, not exclusivity; multiple faculty may volunteer.</p>${renderCards(data,x=>industryCard(x,true,currentUser.verified_faculty===1),'No industry submissions found.')}`}catch(e){showError(e)}}
async function willing(id,value){try{const r=await api(`/api/industry-opportunities/${id}/willingness`,{method:value?'POST':'DELETE',...(value?{body:JSON.stringify({willing:true})}:{})});alert(`${r.status}. Faculty interest count: ${r.interest_count}`);showFacultyInbox()}catch(e){alert(e.message)}}
async function engage(id){try{const state=document.getElementById('eng'+id).value;await api(`/api/industry-opportunities/${id}/engagement`,{method:'PUT',body:JSON.stringify({state})});alert('Engagement state saved.');showFacultyInbox()}catch(e){alert(e.message)}}
async function showSubscriptions(){try{if(!currentUser)await refreshUser();if(!currentUser||currentUser.verified_faculty!==1)throw Error('Sign in with a verified faculty account to edit subscriptions.');const s=await api('/api/me/subscriptions');const choices=['Artificial Intelligence','Data Science','Human-Computer Interaction','Software Engineering'];document.getElementById('content').innerHTML=`<div class="card"><h2>Notification Settings</h2><p>These choices are private and do not appear on public profiles. Notifications are delivered in the in-product Notifications list; browsing remains available even if no notification arrives.</p><label for="subMode">Notify me about</label><select id="subMode"><option value="all" ${s.mode==='all'?'selected':''}>All new opportunities</option><option value="areas" ${s.mode==='areas'?'selected':''}>Selected areas only</option><option value="none" ${s.mode==='none'?'selected':''}>No new-opportunity notifications</option></select><fieldset><legend>Areas</legend>${choices.map(a=>`<label><input type="checkbox" class="subArea" value="${esc(a)}" ${(s.areas||[]).includes(a)?'checked':''} style="width:auto"> ${esc(a)}</label>`).join('')}</fieldset><button class="primary" onclick="saveSubscriptions()">Save subscriptions</button><p id="subMsg" aria-live="polite"></p></div>`}catch(e){showError(e)}}
async function saveSubscriptions(){const msg=document.getElementById('subMsg');try{const mode=document.getElementById('subMode').value;const areas=[...document.querySelectorAll('.subArea:checked')].map(x=>x.value);const r=await api('/api/me/subscriptions',{method:'PUT',body:JSON.stringify({mode,areas})});msg.className='success';msg.textContent='Subscription settings saved.'}catch(e){msg.className='error';msg.textContent=e.message}}
async function showNotifications(){try{if(!currentUser)await refreshUser();if(!currentUser||currentUser.verified_faculty!==1)throw Error('Sign in with a verified faculty account to view notifications.');const data=await api('/api/me/notifications');document.getElementById('content').innerHTML=`<h2>Notifications</h2><p class="muted">In-product notifications for new opportunities matching your subscription settings.</p>${renderCards(data,n=>`<div class="card"><p>${esc(n.message)}</p><p class="muted">${esc(n.created_at)}</p><button onclick="showOpportunityDetail(${n.opportunity_id})">Open opportunity</button></div>`,'No notifications yet.')}`}catch(e){showError(e)}}
async function showOpportunityDetail(id){try{const x=await api('/api/industry-opportunities/'+id);document.getElementById('content').innerHTML=industryCard(x,!!(currentUser&&(currentUser.verified_faculty===1||currentUser.role==='admin')),!!(currentUser&&currentUser.verified_faculty===1))}catch(e){showError(e)}}
async function showFaculty(){try{const q=prompt('Search faculty (optional):','')||'';const area=prompt('Research area (optional):','')||'';const data=await api(`/api/faculty?q=${encodeURIComponent(q)}&area=${encodeURIComponent(area)}`);document.getElementById('content').innerHTML=`<h2>Faculty</h2>${renderCards(data,f=>`<article class="card"><h3>${esc(f.display_name)}</h3><p>${esc(f.description)}</p><p><b>Areas:</b> ${esc(f.areas)}</p><p><b>Inquiry:</b> ${esc(f.inquiry_preference)}</p><button onclick="detailFaculty(${f.id})">Faculty details</button></article>`,'No faculty found.')}`}catch(e){showError(e)}}
async function detailFaculty(id){try{const d=await api('/api/faculty/'+id);document.getElementById('content').innerHTML=`<div class="card"><h2>${esc(d.profile.display_name)}</h2><p>${esc(d.profile.description)}</p><p><b>Areas:</b> ${esc(d.profile.areas)}</p><p><b>Inquiry:</b> ${esc(d.profile.inquiry_preference)}</p><p><a href="mailto:${encodeURIComponent(d.profile.email)}?subject=Project%20inquiry">Contact faculty by email</a></p><h3>Current projects</h3>${renderCards(d.projects,p=>`<article class="card"><h4>${esc(p.title)}</h4><p>${esc(p.description)}</p><p>${esc(p.areas)}</p></article>`,'No current published projects.')}</div>`}catch(e){showError(e)}}
async function showProjects(){try{const area=prompt('Research/project area (optional):','')||'';const term=prompt('Target term (optional):','')||'';const q=prompt('Text search (optional):','')||'';const data=await api(`/api/projects?area=${encodeURIComponent(area)}&term=${encodeURIComponent(term)}&q=${encodeURIComponent(q)}`);document.getElementById('content').innerHTML=`<h2>Faculty-created Projects</h2>${renderCards(data,p=>`<article class="card"><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p><p><b>Areas:</b> ${esc(p.areas)}</p><p><b>Level:</b> ${esc(p.student_level)}</p><p><b>Term:</b> ${esc(p.target_term)}</p><button onclick="detailProject(${p.id})">Project details</button></article>`,'No projects found.')}`}catch(e){showError(e)}}
async function detailProject(id){try{const p=await api('/api/projects/'+id);document.getElementById('content').innerHTML=`<div class="card"><h2>${esc(p.title)}</h2><p>${esc(p.description)}</p><p><b>Area:</b> ${esc(p.areas)}</p><p><b>Level:</b> ${esc(p.student_level)}</p><p><b>Term:</b> ${esc(p.target_term)}</p><p><b>Prerequisite:</b> ${esc(p.prerequisite||'None listed')}</p><p><b>Faculty:</b> ${esc(p.display_name)}</p><button onclick="detailFaculty(${p.faculty_id})">View faculty profile</button><p><a href="mailto:${encodeURIComponent(p.email)}?subject=${encodeURIComponent('Inquiry about '+p.title)}">Contact faculty</a></p></div>`}catch(e){showError(e)}}
async function showMy(){try{if(!currentUser)await refreshUser();if(!currentUser||currentUser.verified_faculty!==1){document.getElementById('content').innerHTML='<div class="card"><h2>Faculty Tools</h2><p>Sign in with a verified faculty account to use these tools.</p></div>';return}document.getElementById('content').innerHTML=`<div class="card"><h2>Faculty Tools</h2><p>Profile visibility: <b>${currentUser.public_profile===1?'Public':'Private'}</b></p><button onclick="setPublicProfile(${currentUser.public_profile===1?'false':'true'})">Make profile ${currentUser.public_profile===1?'private':'public'}</button><h3>Update profile</h3><label for="dn">Display name</label><input id="dn"><label for="desc">Description</label><textarea id="desc"></textarea><label for="areas">Research areas</label><input id="areas"><label for="inq">Inquiry preference</label><select id="inq"><option value="open">Open to general student inquiries</option><option value="projects">Projects only</option><option value="closed">Not currently accepting inquiries</option></select><button class="primary" onclick="saveProfile()">Save profile</button><hr><h3>Create faculty project</h3><label for="pt">Title</label><input id="pt"><label for="pd">Description</label><textarea id="pd"></textarea><label for="pa">Areas</label><input id="pa"><label for="pl">Student level</label><input id="pl"><label for="ptm">Target term</label><input id="ptm"><label for="pp">Prerequisite</label><input id="pp"><label for="ps">Status</label><select id="ps"><option value="draft">Draft</option><option value="published">Published</option></select><button class="primary" onclick="createProject()">Create project</button></div>`}catch(e){showError(e)}}
async function setPublicProfile(value){try{const r=await api('/api/faculty/public-profile?public='+value,{method:'PATCH'});currentUser.public_profile=r.public_profile?1:0;alert('Profile visibility updated.');showMy()}catch(e){alert(e.message)}}
async function saveProfile(){try{await api('/api/faculty/profile',{method:'PUT',body:JSON.stringify({display_name:document.getElementById('dn').value,description:document.getElementById('desc').value,areas:document.getElementById('areas').value,inquiry_preference:document.getElementById('inq').value})});alert('Profile saved.')}catch(e){alert(e.message)}}
async function createProject(){try{const r=await api('/api/projects',{method:'POST',body:JSON.stringify({title:document.getElementById('pt').value,description:document.getElementById('pd').value,areas:document.getElementById('pa').value,student_level:document.getElementById('pl').value,target_term:document.getElementById('ptm').value,prerequisite:document.getElementById('pp').value,status:document.getElementById('ps').value})});alert('Project created: '+r.project_id)}catch(e){alert(e.message)}}
refreshUser().then(showIndustry);
</script>
</body></html>
